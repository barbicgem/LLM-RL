[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "emotion-vec-validation"
version = "0.1.0"
description = "Gate experiment: causal validation of SAE-derived emotion vectors in Gemma-2-2B"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "transformer-lens>=2.0,<3.0",
    "sae-lens>=5.0,<6.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
